name: Build OptiScaler DLSSNR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:

    - name: Download source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure
      run: |
        cmake -B build -S .

    - name: Build Release
      run: |
        cmake --build build --config Release

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: OptiScaler-DLSSNR
        path: |
          build/**/Release/*.dll
          build/**/Release/*.asi
